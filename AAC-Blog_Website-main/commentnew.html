<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Department Blog - Comments with Reply</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .comment-box {
      margin-top: 20px;
    }

    .comment {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #f8f9fa;
      position: relative;
    }

    .comment .name {
      font-weight: 600;
    }

    .comment .time {
      font-size: 0.85rem;
      color: #666;
    }

    .reply-btn {
      font-size: 0.85rem;
      color: #007bff;
      cursor: pointer;
    }

    .replies {
      margin-left: 30px;
      margin-top: 15px;
    }

    .reply-form {
      margin-top: 10px;
    }

    .reply-form textarea {
      resize: none;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <h3 class="mb-4">Leave a Comment</h3>

  <!-- Comment Form -->
  <form id="commentForm">
    <div class="mb-3">
      <label for="name" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="name" required />
    </div>
    <div class="mb-3">
      <label for="roll" class="form-label">Your Roll No</label>
      <input type="text" class="form-control" id="roll" required />
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Your Email</label>
      <input type="email" class="form-control" id="email" required />
    </div>
    <div class="mb-3">
      <label for="comment" class="form-label">Comment</label>
      <textarea class="form-control" id="comment" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Post Comment</button>
  </form>

  <!-- Comments Display Section -->
  <div class="comment-box" id="commentSection">
    <h5 class="mt-5">Comments</h5>
  </div>
</div>

<script>
  const commentForm = document.getElementById("commentForm");
  const commentSection = document.getElementById("commentSection");

  // Handle main comment form submission
  commentForm.addEventListener("submit", function (e) {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const roll = document.getElementById("roll").value.trim();
    const email = document.getElementById("email").value.trim();
    const commentText = document.getElementById("comment").value.trim();

    if (name && roll && email && commentText) {
      const commentElement = createCommentElement(name, commentText, roll);
      commentSection.appendChild(commentElement);
      commentForm.reset();
    }
  });

  // Create a new comment or reply element
  function createCommentElement(name, commentText, roll = "") {
    const commentDiv = document.createElement("div");
    commentDiv.classList.add("comment");

    const currentTime = new Date().toLocaleString();

    commentDiv.innerHTML = `
      <div class="name">${name}${roll ? ` <small class="text-muted">(${roll})</small>` : ""}</div>
      <div class="time">${currentTime}</div>
      <p>${commentText}</p>
      <div class="reply-btn">Reply</div>
      <div class="replies"></div>
    `;

    // Add reply form functionality
    const replyBtn = commentDiv.querySelector(".reply-btn");
    const repliesDiv = commentDiv.querySelector(".replies");

    replyBtn.addEventListener("click", function () {
      if (commentDiv.querySelector(".reply-form")) return;

      const replyForm = document.createElement("form");
      replyForm.classList.add("reply-form");

      replyForm.innerHTML = `
        <div class="mb-2">
          <input type="text" class="form-control form-control-sm mb-2" placeholder="Your Name" required>
          <input type="text" class="form-control form-control-sm mb-2" placeholder="Your Roll No" required>
          <textarea class="form-control form-control-sm" rows="2" placeholder="Write a reply..." required></textarea>
        </div>
        <button type="submit" class="btn btn-sm btn-secondary">Post Reply</button>
      `;

      replyForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const replyName = replyForm.querySelectorAll("input")[0].value.trim();
        const replyRoll = replyForm.querySelectorAll("input")[1].value.trim();
        const replyText = replyForm.querySelector("textarea").value.trim();

        if (replyName && replyText && replyRoll) {
          const replyElement = createCommentElement(replyName, replyText, replyRoll);
          repliesDiv.appendChild(replyElement);
          replyForm.remove();
        }
      });

      repliesDiv.appendChild(replyForm);
    });

    return commentDiv;
  }
</script>

</body>
</html>
